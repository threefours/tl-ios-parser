name: Extract IPA layer

on:
  workflow_dispatch:
  push:
    paths:
      - "ipa/**"
      - "*.ipa"
      - ".github/workflows/from-ipa.yml"

permissions:
  contents: read

concurrency:
  group: from-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  from-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find IPA in the repo and extract layer
        run: |
          set -euo pipefail
          shopt -s nullglob

          IPA=""
          candidates=(ipa/*.ipa *.ipa)
          if [ ${#candidates[@]} -gt 0 ]; then
            IPA="${candidates[0]}"
          fi

          if [ -z "$IPA" ]; then
            echo "::error::Put a decrypted .ipa in the ipa/ folder (or repo root) and push. GitHub rejects files over 100MB unless you use Git LFS (see README)."
            exit 1
          fi

          echo "Using $IPA"
          ls -lh "$IPA"

          mkdir -p "$RUNNER_TEMP/src"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/src/tl_layer"
          export PYTHONPATH="$RUNNER_TEMP/src"

          mkdir -p out
          python -m tl_layer from-ipa "$IPA" -o out/ipa_layer.json

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: ipa-layer
          path: out/ipa_layer.json
          if-no-files-found: error
