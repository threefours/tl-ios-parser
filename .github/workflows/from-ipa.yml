name: Extract IPA layer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that has the .ipa attached (leave empty for the latest release)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: from-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  from-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download IPA from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/ipa"

          if [ -n "${TAG:-}" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.ipa"
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.ipa"
          fi

          shopt -s nullglob
          files=(*.ipa)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .ipa on this release. Open Releases, create a release, attach the decrypted IPA (up to 2GB), then re-run."
            exit 1
          fi
          echo "IPA=${files[0]}" >> "$GITHUB_ENV"
          ls -lh "${files[0]}"

      - name: Extract layer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/src/tl_layer"
          export PYTHONPATH="$RUNNER_TEMP/src"
          mkdir -p out
          python -m tl_layer from-ipa "$RUNNER_TEMP/ipa/$IPA" -o out/ipa_layer.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ipa-layer
          path: |
            out/ipa_layer.json
            out/ipa_layer.txt
          if-no-files-found: error
